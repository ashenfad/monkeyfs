name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to a branch supersedes the run for its previous commit, so
# the matrix runs once per commit that is still under review. The group is
# keyed by head repository and branch: the branch is `github.head_ref` on a
# pull_request and `github.ref_name` on a push to main, and the repository
# is the head repository so two forks pushing the same branch name never
# share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A red platform must not cancel the other one: the whole point of the
      # macOS jobs is seeing which BSD-only path fails while Linux stays green.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # macOS runs the ends of the range rather than every version. What
        # differs on macOS is the platform surface, not the interpreter:
        # os.chflags/lchmod/lchflags exist, the xattr family does not, and
        # shutil takes its fcopyfile path -- none of that varies by Python
        # version. What does vary is the version-conditional patching in
        # install(), and 3.10 and 3.14 are its two extremes (pathlib's
        # _NormalAccessor on 3.10; _rmtree_impl and glob's 3-tuple scandir on
        # 3.14), so the ends cover both axes at 7 jobs instead of 10.
        include:
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest tests/ -v

    - name: Run linter
      run: |
        ruff check monkeyfs/

    - name: Check formatting
      run: |
        ruff format --check monkeyfs/
